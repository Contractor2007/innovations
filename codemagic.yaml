workflows:
  build-apk-windows:
    name: Build Flutter APK & Windows Setup
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      
      - name: Build Android APK
        script: flutter build apk --release
      
      - name: Build Windows Setup File
        script: |
          flutter build windows --release
          # Package Windows build as installer
          # Note: Requires NSIS or similar installer tool
          # Alternative: Create a simple zip package
          cd build/windows/runner/Release
          tar -czf windows-app.tar.gz *
          mv windows-app.tar.gz ../../../
    
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/windows-app.tar.gz
    
    publishing:
      email:
        recipients:
          - gidiondev25@gmail.com
